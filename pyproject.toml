[project]
name = "cvs_stock_entry_import"
authors = [
    { name = "Iftikhar Hussain Syed", email = "iftikhar.hussain@cvshvac.com" }
]
description = "Extracts Material Issuance Summary documents with AI and generates standard ERPNext Stock Entries (Material Issue)"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "license.txt" }
dynamic = ["version"]
dependencies = [
    # frappe and erpnext are installed and managed by bench
    "openai>=1.66.3",
    "PyMuPDF>=1.23.0",
    "rapidfuzz>=3.0.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
